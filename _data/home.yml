contract_title: The Contract
contract_text: We didn't make AIAA's Design/Build/Fly this year. So this spring, my co-president and I are each running a company and going after the same made-up contract for the whole semester.
contract_button: How it works
contract_link: contract.html

news_title: Latest news
news:
