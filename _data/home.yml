founder_title: Hey, I'm Adriel.
founder_text: I study mechanical engineering at Hofstra and I'm doing a co-op at Stellant Systems. I'm president of SHPE, co-president of AIAA and co-president of ASME. Vnua comes from my last name, Ventura. I came up with it in eighth grade and I've put it on my work ever since.
founder_image: assets/img/adriel-stellant.jpg
founder_caption: At Stellant this summer.
founder_button: More about me
founder_link: about.html
