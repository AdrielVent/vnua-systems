hero_title: I'm building tools for machine shops.
hero_text: Small shops make a lot of the parts that go into defense and aerospace. I want to help them keep track of drawing changes and prove how every part was made.
hero_button: See what I'm working on
hero_link: work.html
hero_image: assets/img/skyline.jpg
hero_credit: Manhattan from Long Island City. Photo by me.

work_title: What I'm working on
work_intro: Two tools so far. Both came out of my co-op, where I make engineering drawings, write change notices and build fixtures for the shop floor.
tiles:
  - title: DatumPane
    text: Shows a shop exactly what changed between two versions of a drawing.
